blueprint:
  name: AX Dose Logger Reminder
  description: >-
    State-driven reminder automation for the AX Dose Logger integration.

    Triggers on Dose Status sensor transitions so each state can have its own
    behavior: Due and Overdue run a reminder loop with Take / Snooze / Skip
    notification actions; Limit Reached and 24h Limit send a single warning.
    The phone notification is dismissed automatically when the dose is taken
    by ANY path — notification action, dashboard card, or the take_dose
    service — and Skip records the skipped slot so the next dose time advances.
  domain: automation
  input:
    dose_status_sensor:
      name: Dose Status Sensor
      description: >-
        The "Dose Status" enum sensor generated by AX Dose Logger. This is the
        trigger source — the automation fires each time the state changes.
      selector:
        entity:
          integration: ax_dose_logger
          domain: sensor
          device_class: enum
    next_dose_sensor:
      name: Next Dose Sensor
      description: The Timestamp sensor generated by AX Dose Logger.
      selector:
        entity:
          integration: ax_dose_logger
          domain: sensor
          device_class: timestamp
    take_button:
      name: Take Pill Button
      description: The button generated by AX Dose Logger to log the dose.
      selector:
        entity:
          integration: ax_dose_logger
          domain: button
    safe_to_take_sensor:
      name: Pills Safe to Take Sensor
      description: >
        The "Pills Safe to Take" sensor generated by AX Dose Logger. Used to gate
        the Taken action so a dose taken from the notification cannot bypass
        the pill-limit safety window. Leave blank to disable the guard (not
        recommended for scheduled medications).
      default: ""
      selector:
        entity:
          integration: ax_dose_logger
          domain: sensor
    notify_device:
      name: Notification Device
      description: The mobile phone to send the reminder to.
      selector:
        device:
          integration: mobile_app
    notification_title_due:
      name: Due — notification title
      description: "Sent when the dose becomes due. Default: Medicine reminder"
      default: "Medicine reminder"
    notification_message_due:
      name: Due — notification message
      description: "Default: It's time to take your medication"
      default: "It's time to take your medication"
    notification_title_overdue:
      name: Overdue — notification title
      description: "Sent when the dose becomes overdue. Default: Medicine overdue"
      default: "Medicine overdue"
    notification_message_overdue:
      name: Overdue — notification message
      description: "Default: You missed your medication time — take it as soon as possible."
      default: "You missed your medication time — take it as soon as possible."
    notification_title_limit:
      name: Limit Reached — notification title
      description: "Sent when the pill-count window is full. Default: Pill limit reached"
      default: "Pill limit reached"
    notification_message_limit:
      name: Limit Reached — notification message
      description: "Default: The pill limit window is full — open the AX Dose Logger card to override if needed."
      default: >-
        The pill limit window is full — open the AX Dose Logger card to
        override if needed.
    notification_title_limit_24h:
      name: 24h Limit — notification title
      description: "Sent when the 24h strength limit is hit. Default: Daily limit warning"
      default: "Daily limit warning"
    notification_message_limit_24h:
      name: 24h Limit — notification message
      description: "Default: The 24h strength limit would be exceeded — open the AX Dose Logger card for details."
      default: >-
        The 24h strength limit would be exceeded — open the AX Dose Logger
        card for details.
    action_on_due:
      name: Action on Due (Optional)
      description: >-
        Runs when the dose becomes due (e.g. TTS announcement, lights).
        Runs before the reminder loop starts.
      selector:
        action: {}
      default: []
    action_on_overdue:
      name: Action on Overdue (Optional)
      description: >-
        Runs when the dose becomes overdue (escalation — e.g. notify a
        second device, flash lights). Runs before the reminder loop restarts.
      selector:
        action: {}
      default: []
    action_on_limit_reached:
      name: Action on Limit Reached (Optional)
      description: Runs when the pill-count window locks out.
      selector:
        action: {}
      default: []
    action_on_limit_24h:
      name: Action on 24h Limit (Optional)
      description: Runs when the 24h strength limit is reached.
      selector:
        action: {}
      default: []
    optional_action:
      name: Optional action (every reminder)
      description: >-
        Run an action like notify a speaker alongside every reminder
        notification in the loop.
      selector:
        action: {}
      default: []
    snooze_time:
      name: Snooze Time (minutes)
      default: 30
      selector:
        number:
          min: 5
          max: 120
          unit_of_measurement: min

variables:
  dose_status_sensor: !input dose_status_sensor
  next_dose_sensor: !input next_dose_sensor
  btn_entity: !input take_button
  safe_sensor: !input safe_to_take_sensor
  # The backend fires ax_dose_logger_dose_taken with the config entry_id in
  # the payload (not an entity_id). Derive it from the Take button so the
  # wait-for-taken trigger matches doses logged from ANY path (notification,
  # dashboard card, or the take_dose service).
  entry_id: "{{ config_entry_id(btn_entity) }}"
  # Unique action IDs so multiple pill alarms don't cross-talk
  action_take: "TAKE_{{ btn_entity }}"
  action_snooze: "SNOOZE_{{ btn_entity }}"
  action_skip: "SKIP_{{ btn_entity }}"
  tag_id: "reminder_{{ btn_entity }}"
  snooze_delay: !input snooze_time
  title_due: !input notification_title_due
  message_due: !input notification_message_due
  title_overdue: !input notification_title_overdue
  message_overdue: !input notification_message_overdue
  # Whether the safety guard is active (sensor selected and resolvable)
  guard_active: "{{ safe_sensor not in ['', 'none'] and states(safe_sensor) not in ['unknown', 'unavailable', 'none', ''] }}"
  # Pills currently safe to take (int); 0 means at the pill-limit window
  safe_count: "{{ states(safe_sensor) | int(0) if guard_active | bool else -1 }}"

trigger:
  - platform: state
    entity_id: !input dose_status_sensor
    to: due
    id: due
  - platform: state
    entity_id: !input dose_status_sensor
    to: overdue
    id: overdue
  - platform: state
    entity_id: !input dose_status_sensor
    to: limit_reached
    id: limit_reached
  - platform: state
    entity_id: !input dose_status_sensor
    to: limit_24h
    id: limit_24h

mode: restart

action:
  - choose:
      # ── Limit states: single notice, no reminder loop ─────────────────
      - conditions:
          - condition: trigger
            id: limit_reached
        sequence:
          - choose: []
            default: !input action_on_limit_reached
          - device_id: !input notify_device
            domain: mobile_app
            type: notify
            message: "clear_notification"
            data:
              tag: "{{ tag_id }}"
          - device_id: !input notify_device
            domain: mobile_app
            type: notify
            title: !input notification_title_limit
            message: !input notification_message_limit
            data:
              ttl: 0
              priority: "high"
              tag: "{{ tag_id }}"
          - stop: "Limit notice sent."

      - conditions:
          - condition: trigger
            id: limit_24h
        sequence:
          - choose: []
            default: !input action_on_limit_24h
          - device_id: !input notify_device
            domain: mobile_app
            type: notify
            message: "clear_notification"
            data:
              tag: "{{ tag_id }}"
          - device_id: !input notify_device
            domain: mobile_app
            type: notify
            title: !input notification_title_limit_24h
            message: !input notification_message_limit_24h
            data:
              ttl: 0
              priority: "high"
              tag: "{{ tag_id }}"
          - stop: "24h limit warning sent."

      # ── Due / Overdue: reminder loop ──────────────────────────────────
      # Both states share one loop; the wording is picked live each pass so
      # a due → overdue transition inside the loop escalates automatically.
      - conditions:
          - condition: trigger
            id: [due, overdue]
        sequence:
          # Run the state-specific optional action (due or overdue)
          - choose:
              - conditions: "{{ trigger.id == 'due' }}"
                sequence: !input action_on_due
            default: !input action_on_overdue
          - repeat:
              while:
                # Loop while the medication is still due or overdue
                - condition: template
                  value_template: "{{ states(dose_status_sensor) in ['due', 'overdue'] }}"
              sequence:
                - variables:
                    # Pick the due or overdue wording based on the live state
                    notif_title: "{{ title_overdue if states(dose_status_sensor) == 'overdue' else title_due }}"
                    notif_message: "{{ message_overdue if states(dose_status_sensor) == 'overdue' else message_due }}"
                # Run the optional per-reminder action (e.g. TTS to speaker)
                - choose: []
                  default: !input optional_action
                # Clear the old notification so the new one triggers a sound
                - device_id: !input notify_device
                  domain: mobile_app
                  type: notify
                  message: "clear_notification"
                  data:
                    tag: "{{ tag_id }}"
                # Send the Mobile Notification
                - device_id: !input notify_device
                  domain: mobile_app
                  type: notify
                  title: "{{ notif_title }}"
                  message: "{{ notif_message }}"
                  data:
                    ttl: 0
                    priority: "high"
                    tag: "{{ tag_id }}"
                    actions:
                      - action: "{{ action_take }}"
                        title: "Taken"
                      - action: "{{ action_snooze }}"
                        title: "Snooze ({{ snooze_delay }}m)"
                      - action: "{{ action_skip }}"
                        title: "Skip Dose"
                # Wait for a response: a notification action, the dose being
                # taken by ANY path (event carries entry_id), or the dose
                # status leaving due/overdue (taken / skipped / window moved).
                - wait_for_trigger:
                    - platform: event
                      event_type: mobile_app_notification_action
                      event_data:
                        action: "{{ action_take }}"
                    - platform: event
                      event_type: mobile_app_notification_action
                      event_data:
                        action: "{{ action_snooze }}"
                    - platform: event
                      event_type: mobile_app_notification_action
                      event_data:
                        action: "{{ action_skip }}"
                    - platform: event
                      event_type: ax_dose_logger_dose_taken
                      event_data:
                        entry_id: "{{ entry_id }}"
                    - platform: state
                      entity_id: !input dose_status_sensor
                  timeout:
                    minutes: !input snooze_time
                  continue_on_timeout: true

                # Handle the response
                - choose:
                    # Taken via the notification action
                    - conditions: "{{ wait.trigger is not none and wait.trigger.platform == 'event' and wait.trigger.event.data.action == action_take }}"
                      sequence:
                        # Safety guard: if a Pills Safe to Take sensor is
                        # configured and the rolling pill-limit window is
                        # exhausted (safe_count <= 0), do NOT auto-press the
                        # Take button from the notification. Instead warn the
                        # user and let them decide via the card UI (which
                        # shows the override confirm dialog).
                        - choose:
                            - conditions: "{{ guard_active | bool and safe_count | int(0) <= 0 }}"
                              sequence:
                                - device_id: !input notify_device
                                  domain: mobile_app
                                  type: notify
                                  title: "{{ notif_title }}"
                                  message: "Pill limit reached — open the AX Dose Logger card to override if needed."
                                  data:
                                    ttl: 0
                                    priority: "high"
                                    tag: "{{ tag_id }}"
                          default:
                            - action: button.press
                              target:
                                entity_id: !input take_button
                        # Dismiss the notification either way
                        - device_id: !input notify_device
                          domain: mobile_app
                          type: notify
                          message: "clear_notification"
                          data:
                            tag: "{{ tag_id }}"

                    # Snooze via the notification action
                    - conditions: "{{ wait.trigger is not none and wait.trigger.platform == 'event' and wait.trigger.event.data.action == action_snooze }}"
                      sequence:
                        - delay:
                            minutes: !input snooze_time

                    # Skip via the notification action — record the skip so
                    # next_dose advances and this reminder doesn't re-fire
                    # for the same slot.
                    - conditions: "{{ wait.trigger is not none and wait.trigger.platform == 'event' and wait.trigger.event.data.action == action_skip }}"
                      sequence:
                        - action: ax_dose_logger.skip_dose
                          data:
                            entry_id: "{{ entry_id }}"
                        - device_id: !input notify_device
                          domain: mobile_app
                          type: notify
                          message: "clear_notification"
                          data:
                            tag: "{{ tag_id }}"
                        - stop: "Dose skipped."

                    # Dose taken by any other path (dashboard card, take_dose
                    # service) — the event matches on entry_id. Just dismiss
                    # the notification; the dose is already logged.
                    - conditions: "{{ wait.trigger is not none and wait.trigger.platform == 'event' and wait.trigger.event.event_type == 'ax_dose_logger_dose_taken' }}"
                      sequence:
                        - device_id: !input notify_device
                          domain: mobile_app
                          type: notify
                          message: "clear_notification"
                          data:
                            tag: "{{ tag_id }}"

                    # Dose status left due/overdue (taken, skipped, or the
                    # window moved on) — dismiss the notification.
                    - conditions: "{{ wait.trigger is not none and wait.trigger.platform == 'state' }}"
                      sequence:
                        - device_id: !input notify_device
                          domain: mobile_app
                          type: notify
                          message: "clear_notification"
                          data:
                            tag: "{{ tag_id }}"

                  # No response (timeout) — loop and remind again
                  default: []
