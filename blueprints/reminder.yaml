blueprint:
  name: AX Dose Logger Reminder
  description: >-
    State-driven reminder automation for the AX Dose Logger integration.

    Triggers on Dose Status sensor transitions so each state can have its own
    behavior: Due repeats a reminder until you respond, while Overdue notifies
    once (the miss stays visible on the card and in the Overdue sensor).
    Both carry Take / Snooze / Skip notification actions; Limit Reached and
    24h Limit send an optional warning (off by default). The phone
    notification is dismissed automatically when the dose is taken by ANY
    path — notification action, dashboard card, or the take_dose service —
    and an optional "dose taken" confirmation (with adjustable auto-dismiss)
    can be shown. Skip records the skipped slot so the next dose time advances.

    Want periodic nagging on an overdue dose? Add your own automation with a
    duration trigger on the Overdue sensor (e.g. wait until it has been
    overdue for 48 hours, then repeat) rather than relying on this blueprint
    to re-buzz on a timer.

    Only two selections are needed: the medication's Dose Status sensor and
    your phone. Everything else (take, skip, safety guard) is derived from
    that single sensor.
  domain: automation
  input:
    dose_status_sensor:
      name: Dose Status Sensor
      description: >-
        The "Dose Status" enum sensor generated by AX Dose Logger. This is the
        trigger source — the automation fires each time the state changes, and
        the take/skip actions and safety guard are resolved from it.
      selector:
        entity:
          integration: ax_dose_logger
          domain: sensor
          device_class: enum
    notify_device:
      name: Notification Device
      description: The mobile phone to send the reminder to.
      selector:
        device:
          integration: mobile_app
    notification_title_due:
      name: Due — notification title
      description: "Sent when the dose becomes due. Default: Medicine reminder"
      default: "Medicine reminder"
    notification_message_due:
      name: Due — notification message
      description: "Default: It's time to take your medication"
      default: "It's time to take your medication"
    notification_title_overdue:
      name: Overdue — notification title
      description: >-
        Sent ONCE when the dose becomes overdue (not repeated on a timer).
        Default: Medicine overdue
      default: "Medicine overdue"
    notification_message_overdue:
      name: Overdue — notification message
      description: >-
        Sent once on the transition to overdue. The overdue state stays
        visible on the card and on the Overdue sensor afterwards.
        Default: You missed your medication time — take it as soon as possible.
      default: "You missed your medication time — take it as soon as possible."
    notify_on_limit_reached:
      name: Notify on Limit Reached
      description: >-
        Send a phone notification when the pill-count window locks out.
        Off by default — the "Action on Limit Reached" input below still runs
        if configured.
      default: false
      selector:
        boolean:
    notification_title_limit:
      name: Limit Reached — notification title
      description: "Sent when the pill-count window is full (if enabled above). Default: Pill limit reached"
      default: "Pill limit reached"
    notification_message_limit:
      name: Limit Reached — notification message
      description: "Default: The pill limit window is full — open the AX Dose Logger card to override if needed."
      default: >-
        The pill limit window is full — open the AX Dose Logger card to
        override if needed.
    notify_on_limit_24h:
      name: Notify on 24h Limit
      description: >-
        Send a phone notification when the 24h strength limit is hit.
        Off by default — the "Action on 24h Limit" input below still runs if
        configured.
      default: false
      selector:
        boolean:
    notification_title_limit_24h:
      name: 24h Limit — notification title
      description: "Sent when the 24h strength limit is hit (if enabled above). Default: Daily limit warning"
      default: "Daily limit warning"
    notification_message_limit_24h:
      name: 24h Limit — notification message
      description: "Default: The 24h strength limit would be exceeded — open the AX Dose Logger card for details."
      default: >-
        The 24h strength limit would be exceeded — open the AX Dose Logger
        card for details.
    notify_on_taken:
      name: Notify When Dose Taken
      description: >-
        Send a confirmation notification when the dose is logged (from any
        path — notification action, dashboard card, or service). On by
        default; auto-dismisses after the timeout below.
      default: true
      selector:
        boolean:
    notification_title_taken:
      name: Taken — notification title
      description: "Confirmation sent when the dose is logged (if enabled above). Default: Dose taken"
      default: "Dose taken"
    notification_message_taken:
      name: Taken — notification message
      description: "Default: Your dose has been logged."
      default: "Your dose has been logged."
    taken_timeout:
      name: Taken Confirmation Auto-Dismiss (minutes)
      description: >-
        How long the "dose taken" confirmation stays on screen before it is
        cleared automatically.
      default: 5
      selector:
        number:
          min: 1
          max: 60
          unit_of_measurement: min
    action_on_due:
      name: Action on Due (Optional)
      description: >-
        Runs when the dose becomes due (e.g. TTS announcement, lights).
        Runs before the reminder loop starts.
      selector:
        action: {}
      default: []
    action_on_overdue:
      name: Action on Overdue (Optional)
      description: >-
        Runs when the dose becomes overdue (escalation — e.g. notify a
        second device, flash lights). Runs before the reminder loop restarts.
      selector:
        action: {}
      default: []
    action_on_limit_reached:
      name: Action on Limit Reached (Optional)
      description: Runs when the pill-count window locks out (independent of the notification toggle).
      selector:
        action: {}
      default: []
    action_on_limit_24h:
      name: Action on 24h Limit (Optional)
      description: Runs when the 24h strength limit is reached (independent of the notification toggle).
      selector:
        action: {}
      default: []
    action_on_taken:
      name: Action on Taken (Optional)
      description: >-
        Runs when the dose is logged from any path (e.g. flash lights,
        speak a confirmation on a speaker).
      selector:
        action: {}
      default: []
    optional_action:
      name: Optional action (every reminder)
      description: >-
        Run an action like notify a speaker alongside every reminder
        notification in the loop.
      selector:
        action: {}
      default: []
    snooze_time:
      name: Snooze Time (minutes)
      default: 30
      selector:
        number:
          min: 5
          max: 120
          unit_of_measurement: min

variables:
  dose_status_sensor: !input dose_status_sensor
  # Everything is resolved from the Dose Status sensor's config entry: the
  # backend fires ax_dose_logger_dose_taken with this entry_id in the payload
  # (so the wait-for-taken trigger matches doses logged from ANY path —
  # notification, dashboard card, or the take_dose service), and the
  # take_dose / skip_dose services target it directly.
  entry_id: "{{ config_entry_id(dose_status_sensor) }}"
  # Unique action IDs so multiple pill alarms don't cross-talk
  action_take: "TAKE_{{ entry_id }}"
  action_snooze: "SNOOZE_{{ entry_id }}"
  action_skip: "SKIP_{{ entry_id }}"
  tag_id: "reminder_{{ entry_id }}"
  # Separate tag for the "dose taken" confirmation so clearing it never
  # touches an active reminder notification (and vice versa).
  tag_taken: "taken_{{ entry_id }}"
  snooze_delay: !input snooze_time
  title_due: !input notification_title_due
  message_due: !input notification_message_due
  title_overdue: !input notification_title_overdue
  message_overdue: !input notification_message_overdue
  notify_limit: !input notify_on_limit_reached
  notify_limit_24h: !input notify_on_limit_24h
  notify_taken: !input notify_on_taken
  title_taken: !input notification_title_taken
  message_taken: !input notification_message_taken
  # Safety guard — the Dose Status sensor exposes `safe_count` as an
  # attribute (same compute_safe_to_take source as the "Pills Safe to Take"
  # sensor). 0 means the pill-limit window is full; None (attribute missing
  # or sensor unavailable) fails open so an old backend can't block takes.
  safe_count: "{{ state_attr(dose_status_sensor, 'safe_count') | int(-1) }}"
  guard_active: "{{ state_attr(dose_status_sensor, 'safe_count') is not none }}"

trigger:
  - platform: state
    entity_id: !input dose_status_sensor
    to: due
    id: due
  - platform: state
    entity_id: !input dose_status_sensor
    to: overdue
    id: overdue
  - platform: state
    entity_id: !input dose_status_sensor
    to: limit_reached
    id: limit_reached
  - platform: state
    entity_id: !input dose_status_sensor
    to: limit_24h
    id: limit_24h

mode: restart

action:
  - choose:
      # ── Limit states: optional notice, no reminder loop ───────────────
      - conditions:
          - condition: trigger
            id: limit_reached
        sequence:
          - choose: []
            default: !input action_on_limit_reached
          - device_id: !input notify_device
            domain: mobile_app
            type: notify
            message: "clear_notification"
            data:
              tag: "{{ tag_id }}"
          # Optional warning notification (off by default)
          - choose:
              - conditions: "{{ notify_limit | bool }}"
                sequence:
                  - device_id: !input notify_device
                    domain: mobile_app
                    type: notify
                    title: !input notification_title_limit
                    message: !input notification_message_limit
                    data:
                      ttl: 0
                      priority: "high"
                      tag: "{{ tag_id }}"
          - stop: "Limit notice handled."

      - conditions:
          - condition: trigger
            id: limit_24h
        sequence:
          - choose: []
            default: !input action_on_limit_24h
          - device_id: !input notify_device
            domain: mobile_app
            type: notify
            message: "clear_notification"
            data:
              tag: "{{ tag_id }}"
          # Optional warning notification (off by default)
          - choose:
              - conditions: "{{ notify_limit_24h | bool }}"
                sequence:
                  - device_id: !input notify_device
                    domain: mobile_app
                    type: notify
                    title: !input notification_title_limit_24h
                    message: !input notification_message_limit_24h
                    data:
                      ttl: 0
                      priority: "high"
                      tag: "{{ tag_id }}"
          - stop: "24h limit warning handled."

      # ── Due / Overdue: reminder loop ──────────────────────────────────
      # Both states share one loop; the wording is picked live each pass so
      # a due → overdue transition inside the loop escalates automatically.
      - conditions:
          - condition: trigger
            id: [due, overdue]
        sequence:
          # Run the state-specific optional action (due or overdue)
          - choose:
              - conditions: "{{ trigger.id == 'due' }}"
                sequence: !input action_on_due
            default: !input action_on_overdue
          # Overdue notifies ONCE, on the transition only.
          #
          # "overdue" is a PERSISTENT state: it stays set until the dose is
          # taken or skipped, which on a Cyclic schedule can be a whole cycle.
          # Re-notifying on a timer for that long is alarm fatigue, and a red
          # warning that fires every 30 minutes for days is one the user
          # learns to dismiss — including when it is genuine.
          #
          # So when the reminder loop times out without a response the loop
          # ENDS. The overdue state (and the card, and the Overdue sensor's
          # duration) keeps reporting it; the phone does not keep buzzing.
          # Pressing Snooze still re-notifies exactly as often as the user
          # asks, because that is an explicit request rather than a timer.
          #
          # Want periodic nagging? That is a deliberate per-user policy, so
          # build it in your own automation as a `for:` duration trigger on the
          # Overdue sensor (e.g. wait for > 48h, then repeat) rather than
          # hard-coding one cadence into the shared blueprint.
          - repeat:
              while:
                # Loop while the medication is still due or overdue.  The
                # timeout handler below stops the automation when an
                # unacknowledged reminder is for an OVERDUE dose, so this
                # condition still serves Due (repeat until you respond) while
                # Overdue notifies exactly once (see the note above).
                - condition: template
                  value_template: "{{ states(dose_status_sensor) in ['due', 'overdue'] }}"
              sequence:
                - variables:
                    # Pick the due or overdue wording based on the live state
                    notif_title: "{{ title_overdue if states(dose_status_sensor) == 'overdue' else title_due }}"
                    notif_message: "{{ message_overdue if states(dose_status_sensor) == 'overdue' else message_due }}"
                # Run the optional per-reminder action (e.g. TTS to speaker)
                - choose: []
                  default: !input optional_action
                # Clear the old notification so the new one triggers a sound
                # (also clears a lingering "dose taken" confirmation)
                - device_id: !input notify_device
                  domain: mobile_app
                  type: notify
                  message: "clear_notification"
                  data:
                    tag: "{{ tag_id }}"
                - device_id: !input notify_device
                  domain: mobile_app
                  type: notify
                  message: "clear_notification"
                  data:
                    tag: "{{ tag_taken }}"
                # Send the Mobile Notification
                - device_id: !input notify_device
                  domain: mobile_app
                  type: notify
                  title: "{{ notif_title }}"
                  message: "{{ notif_message }}"
                  data:
                    ttl: 0
                    priority: "high"
                    tag: "{{ tag_id }}"
                    actions:
                      - action: "{{ action_take }}"
                        title: "Taken"
                      - action: "{{ action_snooze }}"
                        title: "Snooze ({{ snooze_delay }}m)"
                      - action: "{{ action_skip }}"
                        title: "Skip Dose"
                # Wait for a response: a notification action, the dose being
                # taken by ANY path (event carries entry_id), or the dose
                # status leaving due/overdue (taken / skipped / window moved).
                - wait_for_trigger:
                    - platform: event
                      event_type: mobile_app_notification_action
                      event_data:
                        action: "{{ action_take }}"
                    - platform: event
                      event_type: mobile_app_notification_action
                      event_data:
                        action: "{{ action_snooze }}"
                    - platform: event
                      event_type: mobile_app_notification_action
                      event_data:
                        action: "{{ action_skip }}"
                    - platform: event
                      event_type: ax_dose_logger_dose_taken
                      event_data:
                        entry_id: "{{ entry_id }}"
                    - platform: state
                      entity_id: !input dose_status_sensor
                  timeout:
                    minutes: !input snooze_time
                  continue_on_timeout: true

                # Handle the response
                - choose:
                    # Taken via the notification action
                    - conditions: "{{ wait.trigger is not none and wait.trigger.platform == 'event' and wait.trigger.event.data.action == action_take }}"
                      sequence:
                        # Safety guard: when the rolling pill-limit window is
                        # exhausted (safe_count <= 0), do NOT auto-log the
                        # dose from the notification. Instead warn the user
                        # and let them decide via the card UI (which shows
                        # the override confirm dialog).
                        - choose:
                            - conditions: "{{ guard_active | bool and safe_count | int(0) <= 0 }}"
                              sequence:
                                - device_id: !input notify_device
                                  domain: mobile_app
                                  type: notify
                                  title: "{{ notif_title }}"
                                  message: "Pill limit reached — open the AX Dose Logger card to override if needed."
                                  data:
                                    ttl: 0
                                    priority: "high"
                                    tag: "{{ tag_id }}"
                          default:
                            - action: ax_dose_logger.take_dose
                              data:
                                entry_id: "{{ entry_id }}"
                        # Dismiss the notification either way
                        - device_id: !input notify_device
                          domain: mobile_app
                          type: notify
                          message: "clear_notification"
                          data:
                            tag: "{{ tag_id }}"
                        # Optional "dose taken" confirmation + action
                        - choose: []
                          default: !input action_on_taken
                        - choose:
                            - conditions: "{{ notify_taken | bool }}"
                              sequence:
                                - device_id: !input notify_device
                                  domain: mobile_app
                                  type: notify
                                  title: "{{ title_taken }}"
                                  message: "{{ message_taken }}"
                                  data:
                                    tag: "{{ tag_taken }}"
                                # Auto-dismiss the confirmation after the
                                # configured timeout
                                - delay:
                                    minutes: !input taken_timeout
                                - device_id: !input notify_device
                                  domain: mobile_app
                                  type: notify
                                  message: "clear_notification"
                                  data:
                                    tag: "{{ tag_taken }}"

                    # Snooze via the notification action
                    - conditions: "{{ wait.trigger is not none and wait.trigger.platform == 'event' and wait.trigger.event.data.action == action_snooze }}"
                      sequence:
                        - delay:
                            minutes: !input snooze_time

                    # Skip via the notification action — record the skip so
                    # next_dose advances and this reminder doesn't re-fire
                    # for the same slot.
                    - conditions: "{{ wait.trigger is not none and wait.trigger.platform == 'event' and wait.trigger.event.data.action == action_skip }}"
                      sequence:
                        - action: ax_dose_logger.skip_dose
                          data:
                            entry_id: "{{ entry_id }}"
                        - device_id: !input notify_device
                          domain: mobile_app
                          type: notify
                          message: "clear_notification"
                          data:
                            tag: "{{ tag_id }}"
                        - stop: "Dose skipped."

                    # Dose taken by any other path (dashboard card, take_dose
                    # service) — the event matches on entry_id. Dismiss the
                    # reminder notification; the dose is already logged.
                    - conditions: "{{ wait.trigger is not none and wait.trigger.platform == 'event' and wait.trigger.event.event_type == 'ax_dose_logger_dose_taken' }}"
                      sequence:
                        - device_id: !input notify_device
                          domain: mobile_app
                          type: notify
                          message: "clear_notification"
                          data:
                            tag: "{{ tag_id }}"
                        # Optional "dose taken" confirmation + action
                        - choose: []
                          default: !input action_on_taken
                        - choose:
                            - conditions: "{{ notify_taken | bool }}"
                              sequence:
                                - device_id: !input notify_device
                                  domain: mobile_app
                                  type: notify
                                  title: "{{ title_taken }}"
                                  message: "{{ message_taken }}"
                                  data:
                                    tag: "{{ tag_taken }}"
                                # Auto-dismiss the confirmation after the
                                # configured timeout
                                - delay:
                                    minutes: !input taken_timeout
                                - device_id: !input notify_device
                                  domain: mobile_app
                                  type: notify
                                  message: "clear_notification"
                                  data:
                                    tag: "{{ tag_taken }}"

                    # Dose status left due/overdue (taken, skipped, or the
                    # window moved on) — dismiss the notification. No
                    # "taken" confirmation here: this branch also catches
                    # skips and window moves, so the reason is ambiguous.
                    - conditions: "{{ wait.trigger is not none and wait.trigger.platform == 'state' }}"
                      sequence:
                        - device_id: !input notify_device
                          domain: mobile_app
                          type: notify
                          message: "clear_notification"
                          data:
                            tag: "{{ tag_id }}"

                  # No response within snooze_time.
                  #
                  # * DUE — loop again: an upcoming dose deserves persistence.
                  # * OVERDUE — stop. The miss is already recorded and stays
                  #   visible on the card + Overdue sensor duration; re-buzzing
                  #   on a timer for what may be days is alarm fatigue, and a
                  #   warning the user learns to ignore is worse than no warning.
                  #   Snooze still re-notifies on explicit request.
                  default:
                    - choose:
                        - conditions: "{{ states(dose_status_sensor) == 'overdue' }}"
                          sequence:
                            - stop: >-
                                Overdue reminder sent once. The overdue state
                                remains visible on the card and the Overdue
                                sensor; build a repeat rule in your own
                                automation if you want periodic nagging.
